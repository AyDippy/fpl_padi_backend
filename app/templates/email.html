<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .content {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h2>{{ title }}</h2>
            <p>Hello {{ name }},</p>
            <p>Your FPL PADI account has been successfully created.</p>
            <p>You can now log in to access all features.</p>
            <p>Thank you for joining us!</p>
            <p>Best regards,<br>The FPL PADI Team</p>
        </div>
    </div>
</body>
</html>
